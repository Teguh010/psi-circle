openapi: 3.0.3
info:
  title: Psi Circle API
  version: 1.0.0-mvp
  description: >
    Contract-first API specification for the Psi Circle MVP. This file is the single
    source of truth for request/response shapes between the Flutter mobile app and the
    NestJS backend. See docs/API.md for conventions and docs/PRIVACY_AND_SECURITY.md for
    mandatory rules (in particular: never return another user's raw coordinates).

    Every response below includes a realistic `example`. Mobile can hand-write mock
    repositories from these examples, or serve this file directly with a mock server
    (e.g. `npx @stoplight/prism-cli mock docs/api/openapi.yaml`) before the backend
    exists.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Profile
  - name: Communities
  - name: Presence
  - name: Discovery
  - name: Connections
  - name: Chat
  - name: Safety

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      operationId: authRegister
      summary: Register a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created, verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
              example:
                data:
                  id: "b1f0c6f0-1111-4a11-9a11-000000000001"
                  email: "alex@example.com"
                  status: "ACTIVE"
                  emailVerifiedAt: null
                  createdAt: "2026-11-15T08:00:00Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthTokens' }
              example:
                data:
                  accessToken: "eyJhbGciOi...access"
                  refreshToken: "eyJhbGciOi...refresh"
                  expiresIn: 900
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthTokens' }
              example:
                data:
                  accessToken: "eyJhbGciOi...newAccess"
                  refreshToken: "eyJhbGciOi...newRefresh"
                  expiresIn: 900
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Revoke the current refresh token / session
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: authVerifyEmail
      summary: Verify email address using a token sent by email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200': { description: Email verified }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ------------------------------------------------------------- Profile
  /users/me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Get the authenticated user's full profile
      responses:
        '200':
          description: Own profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MeResponse' }
              example:
                data:
                  id: "b1f0c6f0-1111-4a11-9a11-000000000001"
                  email: "alex@example.com"
                  status: "ACTIVE"
                  emailVerifiedAt: "2026-11-10T08:00:00Z"
                  username: "alex123"
                  displayName: "Alex"
                  avatarUrl: null
                  bio: "Weekend rider."
                  createdAt: "2026-11-01T08:00:00Z"
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update the authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Profile]
      operationId: deleteMe
      summary: Delete the authenticated user's account
      description: >
        Must remove or anonymize personal data per the applicable retention policy
        (PRD §13 Privacy). Never leaves presence/location data behind.
      responses:
        '204': { description: Account deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/{userId}/profile:
    get:
      tags: [Profile]
      operationId: getUserProfile
      summary: Get another user's public profile
      description: >
        Only returns fields the caller is allowed to see. Never includes coordinates.
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PublicProfile' }
              example:
                data:
                  userId: "a2f0c6f0-2222-4a11-9a11-000000000002"
                  username: "daniel_r"
                  displayName: "Daniel"
                  avatarUrl: null
                  bio: "Cycling every weekend."
                  sharedCommunities:
                    - { id: "c1111111-0000-0000-0000-000000000001", name: "Cycling Community" }
                  connectionStatus: "NONE"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------- Communities
  /communities:
    post:
      tags: [Communities]
      operationId: createCommunity
      summary: Create a community
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommunityRequest' }
      responses:
        '201':
          description: Community created, caller becomes OWNER
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Community' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Communities]
      operationId: searchCommunities
      summary: Search public communities
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Free-text search on name/description
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated list of public communities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityListResponse' }
              example:
                data:
                  - id: "c1111111-0000-0000-0000-000000000001"
                    name: "Automotive Community"
                    slug: "automotive-community"
                    description: "For car enthusiasts."
                    avatarUrl: null
                    visibility: "PUBLIC"
                    memberCount: 128
                    createdAt: "2026-01-10T08:00:00Z"
                meta: { page: 1, limit: 20, total: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /communities/{communityId}:
    get:
      tags: [Communities]
      operationId: getCommunity
      summary: Get community details
      parameters:
        - { $ref: '#/components/parameters/CommunityIdPath' }
      responses:
        '200':
          description: Community details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Community' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Communities]
      operationId: updateCommunity
      summary: Update community (ADMIN/OWNER only)
      parameters:
        - { $ref: '#/components/parameters/CommunityIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCommunityRequest' }
      responses:
        '200':
          description: Updated community
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Community' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Communities]
      operationId: deleteCommunity
      summary: Delete community (OWNER only)
      parameters:
        - { $ref: '#/components/parameters/CommunityIdPath' }
      responses:
        '204': { description: Community deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /communities/{communityId}/join:
    post:
      tags: [Communities]
      operationId: joinCommunity
      summary: Join a community (public = immediate ACTIVE/PENDING per policy, private = requires invitationCode)
      parameters:
        - { $ref: '#/components/parameters/CommunityIdPath' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinCommunityRequest' }
      responses:
        '200':
          description: Membership created/updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CommunityMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /communities/{communityId}/leave:
    post:
      tags: [Communities]
      operationId: leaveCommunity
      summary: Leave a community
      parameters:
        - { $ref: '#/components/parameters/CommunityIdPath' }
      responses:
        '204': { description: Left community }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /communities/{communityId}/members:
    get:
      tags: [Communities]
      operationId: listCommunityMembers
      summary: List ACTIVE members of a community
      parameters:
        - { $ref: '#/components/parameters/CommunityIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated member list (never includes location)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityMemberListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------ Presence
  /presence/visible:
    post:
      tags: [Presence]
      operationId: setPresenceVisible
      summary: Turn Visible on and publish a temporary presence
      description: >
        Backend validates: authenticated, ACTIVE membership on every community id
        supplied, valid coordinates, radius within configured max, caller not globally
        blocked in a way that affects eligibility. Coordinates are written only to Redis
        and are never returned by any endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresenceVisibleRequest' }
            example:
              latitude: -7.123456
              longitude: 112.123456
              activeCommunityIds: ["c1111111-0000-0000-0000-000000000001"]
              radius: 3000
      responses:
        '200':
          description: Presence published
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PresenceStatus' }
              example:
                data:
                  visibility: "VISIBLE"
                  activeCommunityIds: ["c1111111-0000-0000-0000-000000000001"]
                  radius: 3000
                  updatedAt: "2026-11-15T08:00:00Z"
                  expiresAt: "2026-11-15T08:02:00Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not an ACTIVE member of one or more supplied communities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /presence/invisible:
    post:
      tags: [Presence]
      operationId: setPresenceInvisible
      summary: Turn Invisible immediately
      description: Deletes the Redis presence key and all GEO-set membership immediately.
      responses:
        '200':
          description: Presence cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PresenceStatus' }
              example:
                data:
                  visibility: "INVISIBLE"
                  activeCommunityIds: []
                  radius: null
                  updatedAt: "2026-11-15T08:05:00Z"
                  expiresAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  /presence/heartbeat:
    post:
      tags: [Presence]
      operationId: presenceHeartbeat
      summary: Refresh presence TTL (and optionally updated coordinates)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresenceVisibleRequest' }
      responses:
        '200':
          description: TTL refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PresenceStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Presence not active (user must call /presence/visible first)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /presence/status:
    get:
      tags: [Presence]
      operationId: getPresenceStatus
      summary: Get the authenticated user's own presence status
      description: Never includes coordinates, only metadata about the caller's own state.
      responses:
        '200':
          description: Current presence status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PresenceStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------- Discovery
  /discovery/nearby:
    get:
      tags: [Discovery]
      operationId: getNearbyDiscovery
      summary: Find nearby Visible members sharing an active community
      parameters:
        - in: query
          name: radius
          schema: { type: integer, minimum: 100, maximum: 10000, default: 3000 }
          description: Meters. Server clamps to the configured maximum (10km default).
        - in: query
          name: communityId
          required: true
          schema: { type: string, format: uuid }
          description: Must be one of the caller's own activeCommunityIds.
      responses:
        '200':
          description: >
            Nearby members, with bucketed/approximate distance only. Never contains
            latitude/longitude for any user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryNearbyResponse' }
              example:
                data:
                  - userId: "a2f0c6f0-2222-4a11-9a11-000000000002"
                    displayName: "Alex"
                    username: "alex123"
                    avatarUrl: null
                    community: { id: "c1111111-0000-0000-0000-000000000001", name: "Automotive Community" }
                    distanceLabel: "300-500 m"
                  - userId: "d3f0c6f0-3333-4a11-9a11-000000000003"
                    displayName: "Daniel"
                    username: "daniel_r"
                    avatarUrl: null
                    community: { id: "c2222222-0000-0000-0000-000000000002", name: "Cycling Community" }
                    distanceLabel: "500 m-1 km"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not Visible, or not an ACTIVE member of communityId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------- Connections
  /connections/wave:
    post:
      tags: [Connections]
      operationId: sendWave
      summary: Send a Wave to another user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaveRequest' }
      responses:
        '201':
          description: Wave sent (connection in PENDING state)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Connection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Recipient has blocked the caller or vice versa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: A pending Wave to this user already exists, or daily limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /connections/requests:
    get:
      tags: [Connections]
      operationId: listConnectionRequests
      summary: List incoming pending Wave requests
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated incoming requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /connections/{connectionId}/accept:
    post:
      tags: [Connections]
      operationId: acceptConnection
      summary: Accept a pending Wave
      parameters:
        - { $ref: '#/components/parameters/ConnectionIdPath' }
      responses:
        '200':
          description: Connection accepted, chat is now available
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Connection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /connections/{connectionId}/reject:
    post:
      tags: [Connections]
      operationId: rejectConnection
      summary: Reject a pending Wave
      parameters:
        - { $ref: '#/components/parameters/ConnectionIdPath' }
      responses:
        '200':
          description: Connection rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Connection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /connections:
    get:
      tags: [Connections]
      operationId: listConnections
      summary: List the caller's accepted connections
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated accepted connections
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------------- Chat
  /chats:
    get:
      tags: [Chat]
      operationId: listConversations
      summary: List the caller's conversations
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated conversation list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Chat]
      operationId: createConversation
      summary: Create (or fetch existing) conversation with an accepted connection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201':
          description: Conversation created or existing one returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller and recipient are not an ACCEPTED connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /chats/{conversationId}/messages:
    get:
      tags: [Chat]
      operationId: listMessages
      summary: Get messages for a conversation (caller must be a member)
      parameters:
        - { $ref: '#/components/parameters/ConversationIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated message history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Chat]
      operationId: sendMessage
      summary: Send a message (caller must be a member)
      parameters:
        - { $ref: '#/components/parameters/ConversationIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------- Safety
  /users/{userId}/block:
    post:
      tags: [Safety]
      operationId: blockUser
      summary: Block a user
      parameters:
        - { $ref: '#/components/parameters/UserIdPath' }
      responses:
        '204': { description: User blocked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Safety]
      operationId: unblockUser
      summary: Unblock a user
      parameters:
        - { $ref: '#/components/parameters/UserIdPath' }
      responses:
        '204': { description: User unblocked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports:
    post:
      tags: [Safety]
      operationId: createReport
      summary: Report a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
      responses:
        '201':
          description: Report filed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UserReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/blocked:
    get:
      tags: [Safety]
      operationId: listBlockedUsers
      summary: List users the caller has blocked
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated blocked-user list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockedUserListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    UserIdPath:
      in: path
      name: userId
      required: true
      schema: { type: string, format: uuid }
    CommunityIdPath:
      in: path
      name: communityId
      required: true
      schema: { type: string, format: uuid }
    ConnectionIdPath:
      in: path
      name: connectionId
      required: true
      schema: { type: string, format: uuid }
    ConversationIdPath:
      in: path
      name: conversationId
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 400, error: "Bad Request", message: "email must be a valid email" }
    Unauthorized:
      description: Missing/invalid/expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 401, error: "Unauthorized", message: "Invalid or expired token" }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 403, error: "Forbidden", message: "You do not have permission to perform this action" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 404, error: "Not Found", message: "Resource not found" }
    Conflict:
      description: Conflicting state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 409, error: "Conflict", message: "Email already registered" }

  schemas:
    ErrorResponse:
      type: object
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message: { type: string }
      required: [statusCode, message]

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, DELETED]

    CommunityVisibility:
      type: string
      enum: [PUBLIC, PRIVATE]

    MembershipRole:
      type: string
      enum: [MEMBER, ADMIN, OWNER]

    MembershipStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED, BANNED, LEFT]

    ConnectionStatus:
      type: string
      enum: [NONE, PENDING, ACCEPTED, REJECTED, BLOCKED]

    PresenceVisibility:
      type: string
      enum: [VISIBLE, INVISIBLE, EVENT]

    ReportStatus:
      type: string
      enum: [OPEN, REVIEWED, DISMISSED]

    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: "Access token TTL in seconds" }
      required: [accessToken, refreshToken, expiresIn]

    RegisterRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]

    RefreshRequest:
      type: object
      properties:
        refreshToken: { type: string }
      required: [refreshToken]

    VerifyEmailRequest:
      type: object
      properties:
        token: { type: string }
      required: [token]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/UserStatus' }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    MeResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            username: { type: string }
            displayName: { type: string }
            avatarUrl: { type: string, nullable: true }
            bio: { type: string, nullable: true }

    UpdateProfileRequest:
      type: object
      properties:
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        bio: { type: string, nullable: true }

    PublicProfile:
      type: object
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        sharedCommunities:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        connectionStatus: { $ref: '#/components/schemas/ConnectionStatus' }

    CreateCommunityRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/CommunityVisibility' }
        avatarUrl: { type: string, nullable: true }
      required: [name, description, visibility]

    UpdateCommunityRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/CommunityVisibility' }
        avatarUrl: { type: string, nullable: true }

    Community:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        avatarUrl: { type: string, nullable: true }
        visibility: { $ref: '#/components/schemas/CommunityVisibility' }
        memberCount: { type: integer }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CommunityListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Community' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    JoinCommunityRequest:
      type: object
      properties:
        invitationCode:
          type: string
          nullable: true
          description: Required when the target community visibility is PRIVATE.

    CommunityMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        communityId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/MembershipRole' }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        joinedAt: { type: string, format: date-time }
        profile:
          type: object
          properties:
            username: { type: string }
            displayName: { type: string }
            avatarUrl: { type: string, nullable: true }

    CommunityMemberListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CommunityMember' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PresenceVisibleRequest:
      type: object
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        activeCommunityIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
        radius:
          type: integer
          minimum: 100
          maximum: 10000
          default: 3000
      required: [latitude, longitude, activeCommunityIds]

    PresenceStatus:
      type: object
      description: Never includes latitude/longitude.
      properties:
        visibility: { $ref: '#/components/schemas/PresenceVisibility' }
        activeCommunityIds:
          type: array
          items: { type: string, format: uuid }
        radius: { type: integer, nullable: true }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }

    DiscoveryNearbyItem:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        username: { type: string }
        avatarUrl: { type: string, nullable: true }
        community:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        distanceLabel:
          type: string
          description: "Bucketed label, e.g. 'Less than 500 m', '500 m-1 km', '1-3 km', '3-5 km'. Never a precise value."

    DiscoveryNearbyResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DiscoveryNearbyItem' }

    WaveRequest:
      type: object
      properties:
        recipientId: { type: string, format: uuid }
      required: [recipientId]

    Connection:
      type: object
      properties:
        id: { type: string, format: uuid }
        requesterId: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ConnectionStatus' }
        otherUser:
          type: object
          properties:
            userId: { type: string, format: uuid }
            displayName: { type: string }
            username: { type: string }
            avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConnectionListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Connection' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    CreateConversationRequest:
      type: object
      properties:
        recipientId:
          type: string
          format: uuid
          description: Must be an ACCEPTED connection of the caller.
      required: [recipientId]

    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        members:
          type: array
          items:
            type: object
            properties:
              userId: { type: string, format: uuid }
              displayName: { type: string }
              username: { type: string }
              avatarUrl: { type: string, nullable: true }
        lastMessage:
          type: object
          nullable: true
          properties:
            content: { type: string }
            senderId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
        unreadCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConversationListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    SendMessageRequest:
      type: object
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
      required: [content]

    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        content: { type: string }
        createdAt: { type: string, format: date-time }

    MessageListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ReportRequest:
      type: object
      properties:
        reportedUserId: { type: string, format: uuid }
        reason: { type: string }
        description: { type: string, nullable: true }
      required: [reportedUserId, reason]

    UserReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        reporterId: { type: string, format: uuid }
        reportedUserId: { type: string, format: uuid }
        reason: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { type: string, format: date-time }

    BlockedUser:
      type: object
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        blockedAt: { type: string, format: date-time }

    BlockedUserListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BlockedUser' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PageMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
